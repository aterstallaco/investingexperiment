<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investing Experiment — Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAFAF7;
    --white: #FFFFFF;
    --surface: #FFFFFF;
    --navy: #1B2A4A;
    --navy-light: #2C3E6B;
    --navy-faint: rgba(27, 42, 74, 0.04);
    --gold: #B8923E;
    --gold-light: #D4AD5C;
    --gold-faint: rgba(184, 146, 62, 0.08);
    --gold-border: rgba(184, 146, 62, 0.2);
    --green: #2D8F5E;
    --green-light: #E8F5EE;
    --green-faint: rgba(45, 143, 94, 0.08);
    --red: #C0392B;
    --red-light: #FCEAE8;
    --red-faint: rgba(192, 57, 43, 0.08);
    --text: #2D2D2D;
    --text-secondary: #5A5A5A;
    --text-light: #8A8A8A;
    --border: #E5E2DC;
    --border-light: #EDEBE6;
    --rule: #D4D0C8;
    --silver-medal: #6B7C93;
    --bronze-medal: #A67C52;
    --font-display: 'Libre Baskerville', Georgia, serif;
    --font-body: 'Source Sans 3', 'Segoe UI', sans-serif;
    --max-w: 780px;
    --transition: 0.3s ease;
    --radius: 6px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    line-height: 1.7;
    font-size: 16px;
  }

  /* ── Top Bar ──────────────────────────────────────── */
  .topbar {
    background: var(--navy);
    padding: 14px 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .topbar-logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .topbar-logo svg { width: 28px; height: 28px; }
  .topbar-title {
    font-family: var(--font-display);
    color: var(--white);
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .topbar-nav {
    position: absolute;
    right: 32px;
  }
  .topbar-link {
    color: rgba(255,255,255,0.55);
    font-size: 13px;
    text-decoration: none;
    letter-spacing: 0.04em;
    transition: color var(--transition);
  }
  .topbar-link:hover { color: rgba(255,255,255,0.9); }

  /* ── Hero ─────────────────────────────────────────── */
  .hero {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 56px 32px 48px;
    text-align: center;
  }
  .hero-overline {
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 16px;
  }
  .hero h1 {
    font-family: var(--font-display);
    font-size: clamp(26px, 4.5vw, 38px);
    font-weight: 400;
    color: var(--navy);
    line-height: 1.3;
    margin-bottom: 12px;
    letter-spacing: -0.01em;
  }
  .hero-subtitle {
    font-size: 16px;
    color: var(--text-secondary);
    max-width: 480px;
    margin: 0 auto;
    line-height: 1.65;
    font-weight: 300;
  }

  /* ── Content ──────────────────────────────────────── */
  .content {
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 40px 28px 80px;
  }

  /* ── Section Label ────────────────────────────────── */
  .section-label {
    font-family: var(--font-display);
    font-size: 13px;
    color: var(--gold);
    letter-spacing: 0.06em;
    margin-bottom: 14px;
    font-weight: 400;
  }

  /* ── Leaderboard ──────────────────────────────────── */
  .leaderboard {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 32px;
    margin-bottom: 32px;
  }
  .lb-row {
    display: grid;
    grid-template-columns: 36px 1fr auto;
    align-items: center;
    gap: 14px;
    padding: 13px 16px;
    border-radius: 4px;
    margin-bottom: 2px;
    cursor: pointer;
    transition: background var(--transition);
  }
  .lb-row:hover { background: var(--navy-faint); }
  .lb-row.active { background: var(--gold-faint); outline: 1px solid var(--gold-border); }
  .lb-rank {
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 700;
    text-align: center;
    width: 28px;
  }
  .lb-rank.r1 { color: var(--gold); }
  .lb-rank.r2 { color: var(--silver-medal); }
  .lb-rank.r3 { color: var(--bronze-medal); }
  .lb-rank.rx { color: var(--text-light); }
  .lb-name {
    font-weight: 500;
    font-size: 15px;
    color: var(--navy);
  }
  .lb-name .leader-badge {
    display: inline-block;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--gold);
    background: var(--gold-faint);
    border: 1px solid var(--gold-border);
    padding: 2px 7px;
    border-radius: 3px;
    margin-left: 8px;
    vertical-align: middle;
  }
  .lb-ret {
    font-weight: 600;
    font-size: 15px;
    font-family: var(--font-display);
    letter-spacing: -0.01em;
  }
  .lb-ret.pos { color: var(--green); }
  .lb-ret.neg { color: var(--red); }
  .lb-ret.flat { color: var(--text-light); }

  /* ── Tabs ─────────────────────────────────────────── */
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .tab {
    padding: 9px 20px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-secondary);
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--transition);
    white-space: nowrap;
  }
  .tab:hover { border-color: var(--rule); color: var(--navy); }
  .tab.active {
    background: var(--navy);
    border-color: var(--navy);
    color: var(--white);
  }

  /* ── Portfolio Card ───────────────────────────────── */
  .port-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 32px 32px;
    margin-bottom: 24px;
  }
  .port-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }
  .port-name {
    font-family: var(--font-display);
    font-size: 19px;
    color: var(--navy);
    font-weight: 400;
  }
  .port-summary {
    display: flex;
    gap: 24px;
    padding: 20px 24px;
    background: var(--navy-faint);
    border-radius: 4px;
    margin-bottom: 24px;
  }
  .sum-col { flex: 1; }
  .sum-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-light);
    margin-bottom: 6px;
  }
  .sum-val {
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 400;
    color: var(--navy);
    letter-spacing: -0.01em;
  }
  .sum-val.pos { color: var(--green); }
  .sum-val.neg { color: var(--red); }
  .sum-val.flat { color: var(--text-light); }
  .sum-sub {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  /* ── Stock Table ──────────────────────────────────── */
  .stock-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  .stock-table thead {
    background: var(--navy-faint);
    border-top: 1px solid var(--border-light);
    border-bottom: 1px solid var(--border-light);
  }
  .stock-table th {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-light);
    text-align: left;
    padding: 10px 12px;
  }
  .stock-table th.num { text-align: right; }
  .stock-table tbody tr {
    border-bottom: 1px solid var(--border-light);
    transition: background var(--transition);
  }
  .stock-table tbody tr:hover { background: var(--navy-faint); }
  .stock-table tbody tr:last-child { border-bottom: none; }
  .stock-table td {
    padding: 14px 12px;
    color: var(--text);
  }
  .stock-table td.num {
    text-align: right;
    font-family: var(--font-display);
    font-size: 14px;
    letter-spacing: -0.01em;
  }
  .stock-table td.pos { color: var(--green); font-weight: 600; }
  .stock-table td.neg { color: var(--red); font-weight: 600; }
  .stock-table td.flat { color: var(--text-light); }
  .stock-sym {
    font-weight: 600;
    color: var(--navy);
    font-size: 14px;
  }
  .stock-price-update {
    font-size: 11px;
    color: var(--text-light);
    font-style: italic;
  }

  /* ── News Feed ────────────────────────────────────── */
  .news-feed {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 28px 28px;
    margin-top: 24px;
  }
  .news-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }
  .news-refresh {
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 500;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all var(--transition);
  }
  .news-refresh:hover {
    border-color: var(--navy);
    color: var(--navy);
  }
  .news-list {
    list-style: none;
  }
  .news-item {
    display: flex;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border-light);
  }
  .news-item:last-child { border-bottom: none; }
  .news-ticker {
    font-family: var(--font-display);
    font-size: 12px;
    font-weight: 600;
    color: var(--gold);
    flex-shrink: 0;
    width: 48px;
    text-align: right;
    padding-top: 2px;
  }
  .news-body { flex: 1; }
  .news-title a {
    color: var(--navy);
    text-decoration: none;
    font-weight: 500;
    font-size: 14px;
    line-height: 1.5;
  }
  .news-title a:hover { color: var(--navy-light); text-decoration: underline; }
  .news-meta {
    display: flex;
    gap: 10px;
    font-size: 12px;
    color: var(--text-light);
    margin-top: 4px;
  }
  .news-source { font-weight: 500; }
  .news-loading, .news-empty {
    text-align: center;
    color: var(--text-light);
    font-size: 13px;
    padding: 20px;
  }

  /* ── Debug Panel ──────────────────────────────────── */
  .debug-panel {
    background: #f8f8f8;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 16px;
    margin-bottom: 24px;
    font-family: monospace;
    font-size: 12px;
  }
  .debug-title {
    font-weight: bold;
    margin-bottom: 8px;
    color: var(--navy);
  }
  .debug-log {
    color: #666;
    line-height: 1.6;
  }
  .debug-error {
    color: var(--red);
    font-weight: bold;
  }
  .debug-success {
    color: var(--green);
    font-weight: bold;
  }

  /* ── Status Bar ───────────────────────────────────── */
  .status {
    text-align: center;
    font-size: 13px;
    color: var(--text-light);
    margin-top: 40px;
    padding-top: 24px;
    border-top: 1px solid var(--border-light);
  }
  .status a {
    color: var(--gold);
    text-decoration: none;
  }
  .status a:hover { text-decoration: underline; }

  /* ── Footer ───────────────────────────────────────── */
  .footer {
    text-align: center;
    font-size: 13px;
    color: var(--text-light);
    padding: 40px 24px 60px;
    border-top: 1px solid var(--border-light);
    margin-top: 40px;
  }

  /* ── Utilities ────────────────────────────────────── */
  .spin {
    display: inline-block;
    width: 11px;
    height: 11px;
    border: 2px solid var(--border);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-state {
    text-align: center;
    padding: 60px 24px;
    color: var(--text-light);
    font-size: 14px;
  }

  /* ── Loading Overlay ──────────────────────────────── */
  .loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(250, 250, 247, 0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 1000;
  }
  .loading-overlay .spin {
    width: 32px;
    height: 32px;
    border-width: 3px;
  }
  .loading-text {
    font-size: 14px;
    color: var(--text-secondary);
  }

  @media (max-width: 600px) {
    .topbar { padding: 12px 20px; }
    .topbar-nav { position: static; margin-top: 8px; }
    .hero { padding: 40px 24px 36px; }
    .content { padding: 32px 20px 60px; }
    .leaderboard { padding: 20px 20px; }
    .lb-row { grid-template-columns: 28px 1fr auto; gap: 10px; padding: 10px 12px; }
    .port-card { padding: 20px 20px 24px; }
    .port-summary { flex-direction: column; gap: 16px; }
    .stock-table { font-size: 13px; }
    .stock-table th, .stock-table td { padding: 10px 8px; }
    .news-feed { padding: 20px 20px 24px; }
    .news-item { gap: 10px; }
    .news-ticker { width: 42px; }
  }
</style>
</head>
<body>

<div id="loading" class="loading-overlay">
  <span class="spin"></span>
  <div class="loading-text">Loading portfolio data...</div>
</div>

<div class="topbar">
  <div class="topbar-logo">
    <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="1" y="1" width="26" height="26" rx="4" stroke="rgba(184,146,62,0.5)" stroke-width="1.2"/>
      <path d="M7 20 L11 13 L15.5 16 L21 8" stroke="#B8923E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="21" cy="8" r="1.8" fill="#B8923E"/>
    </svg>
    <span class="topbar-title">Investing Experiment</span>
  </div>
  <div class="topbar-nav">
    <a href="https://aterstallaco.github.io/investingexperiment/Outline.html" class="topbar-link">Guidelines</a>
  </div>
</div>

<div class="hero">
  <div class="hero-overline">Investing Experiment · 2026</div>
  <h1>Portfolio Tracker</h1>
  <p class="hero-subtitle">Real-time performance tracking for our $100 investing experiment</p>
</div>

<div class="content">
  <!-- Debug Panel (remove this once working) -->
  <div id="debug-panel" class="debug-panel" style="display: none;">
    <div class="debug-title">Debug Log</div>
    <div id="debug-log" class="debug-log"></div>
  </div>

  <div class="section-label">Leaderboard</div>
  <div id="leaderboard-section" class="leaderboard"></div>

  <div class="section-label">Portfolios</div>
  <div id="tabs-section" class="tabs"></div>
  <div id="portfolio-section"></div>
  <div id="news-section"></div>

  <div id="status-section" class="status"></div>
</div>

<div class="footer">
  Investing Experiment &middot; For entertainment and educational purposes &middot; Not financial advice
</div>

<script>(function() {
  'use strict';

  // ═══ State & Configuration ══════════════════════════
  let state = { people: [], updated: null };
  let active = null;
  let quotes = {};
  let loading = false;
  let debugLogs = [];

  const JSON_URL = 'family-investing-data.json'; 

  // ═══ Debug Logging ═══════════════════════════════════
  function debugLog(msg, isError = false, isSuccess = false) {
    const timestamp = new Date().toLocaleTimeString();
    const className = isError ? 'debug-error' : isSuccess ? 'debug-success' : '';
    debugLogs.push(`<div class="${className}">[${timestamp}] ${msg}</div>`);
    
    const debugPanel = document.getElementById('debug-panel');
    const debugLogEl = document.getElementById('debug-log');
    if (debugPanel && debugLogEl) {
      debugPanel.style.display = 'block';
      debugLogEl.innerHTML = debugLogs.slice(-10).join('');
    }
    
    console.log(msg);
  }

  // ═══ Load Portfolio Data ═════════════════════════════
  async function loadPortfolioData() {
    try {
      debugLog('Loading portfolio JSON...');
      const resp = await fetch(JSON_URL);
      if (!resp.ok) throw new Error('Failed to load portfolio data');
      const data = await resp.json();
      
      if (data.people && Array.isArray(data.people)) {
        state = data;
        if (state.people.length > 0 && !active) {
          active = state.people[0].id;
        }
        debugLog(`Loaded ${state.people.length} portfolios`, false, true);
        document.getElementById('loading').style.display = 'none';
        
        // Show UI with purchase prices first
        render();
        
        // Then fetch live prices
        debugLog('Starting price fetch...');
        await refreshAll();
        
        // And news
        refreshNews();
      }
    } catch (err) {
      debugLog('Error loading data: ' + err.message, true);
      document.getElementById('loading').innerHTML = `<div class="loading-text" style="color: var(--red);">Error: ${err.message}</div>`;
    }
  }

  // ═══ Price Fetching with Multiple Fallbacks ═════════
  async function refreshAll() {
    if (loading) return;
    loading = true;
    renderStatus();
    
    const syms = [...new Set(state.people.flatMap(p => p.stocks.map(s => s.symbol)))];
    debugLog(`Fetching prices for: ${syms.join(', ')}`);
    
    // Try multiple methods in sequence
    let success = false;
    
    // Method 1: Direct Yahoo Finance (fastest if it works)
    if (!success) {
      debugLog('Trying direct Yahoo Finance API...');
      success = await tryDirectYahoo(syms);
    }
    
    // Method 2: AllOrigins proxy
    if (!success) {
      debugLog('Trying AllOrigins proxy...');
      success = await tryProxy(syms, 'https://api.allorigins.win/raw?url=');
    }
    
    // Method 3: CORS.sh proxy
    if (!success) {
      debugLog('Trying CORS.sh proxy...');
      success = await tryProxy(syms, 'https://cors.sh/');
    }
    
    // Method 4: corsproxy.io (slowest but most reliable)
    if (!success) {
      debugLog('Trying corsproxy.io...');
      success = await tryProxy(syms, 'https://corsproxy.io/?');
    }
    
    if (!success) {
      debugLog('All price fetch methods failed', true);
    }
    
    loading = false;
    render();
  }

  async function tryDirectYahoo(syms) {
    try {
      const symbolString = syms.map(encodeURIComponent).join(',');
      const url = `https://query1.finance.yahoo.com/v7/finance/quote?symbols=${symbolString}`;
      
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 8000);
      
      const resp = await fetch(url, { signal: controller.signal });
      clearTimeout(timeoutId);
      
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      
      const json = await resp.json();
      const results = json?.quoteResponse?.result || [];
      
      if (results.length === 0) throw new Error('No results returned');
      
      results.forEach(q => {
        quotes[q.symbol] = {
          price: q.regularMarketPrice || 0,
          chg: q.regularMarketChange || 0,
          chgPct: q.regularMarketChangePercent || 0,
          ts: Date.now()
        };
      });
      
      state.updated = Date.now();
      debugLog(`✓ Direct fetch successful: ${results.length} quotes`, false, true);
      return true;
    } catch(e) {
      debugLog(`Direct fetch failed: ${e.message}`, true);
      return false;
    }
  }

  async function tryProxy(syms, proxyUrl) {
    try {
      const symbolString = syms.map(encodeURIComponent).join(',');
      const yfUrl = `https://query1.finance.yahoo.com/v7/finance/quote?symbols=${symbolString}`;
      const url = `${proxyUrl}${encodeURIComponent(yfUrl)}`;
      
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 10000);
      
      const resp = await fetch(url, { signal: controller.signal });
      clearTimeout(timeoutId);
      
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      
      const json = await resp.json();
      const results = json?.quoteResponse?.result || [];
      
      if (results.length === 0) throw new Error('No results returned');
      
      results.forEach(q => {
        quotes[q.symbol] = {
          price: q.regularMarketPrice || 0,
          chg: q.regularMarketChange || 0,
          chgPct: q.regularMarketChangePercent || 0,
          ts: Date.now()
        };
      });
      
      state.updated = Date.now();
      debugLog(`✓ Proxy fetch successful: ${results.length} quotes`, false, true);
      return true;
    } catch(e) {
      debugLog(`Proxy ${proxyUrl} failed: ${e.message}`, true);
      return false;
    }
  }

  // ═══ Calculations ════════════════════════════════════
  function calcStock(stock) {
    const q = quotes[stock.symbol];
    const cur = q ? q.price : 0;
    const buyPrice = parseFloat(stock.buyPrice) || 0;
    const cost = stock.shares * buyPrice;
    const val = stock.shares * cur;
    const gain = val - cost;
    const ret = cost > 0 ? ((gain / cost) * 100) : 0;
    return { cur, cost, val, gain, ret };
  }

  function calcPerson(person) {
    const stocks = person.stocks.map(s => ({ ...s, ...calcStock(s) }));
    const cost = stocks.reduce((a, s) => a + s.cost, 0);
    const val = stocks.reduce((a, s) => a + s.val, 0);
    const gain = val - cost;
    const ret = cost > 0 ? ((gain / cost) * 100) : 0;
    return { ...person, stocks, cost, val, gain, ret };
  }

  // ═══ UI Rendering ════════════════════════════════════
  const fmt = (n) => (typeof n === 'number' ? n.toFixed(2) : '0.00');
  const fmtPct = (n) => (n >= 0 ? '+' : '') + fmt(n) + '%';
  const fmtDollar = (n) => '$' + fmt(Math.abs(n));
  const esc = (s) => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[m]));

  function render() {
    const people = state.people.map(calcPerson);
    people.sort((a, b) => b.ret - a.ret);
    
    renderLeaderboard(people);
    renderTabs(people);
    renderPortfolio(people);
    renderStatus();
  }

  function renderLeaderboard(people) {
    const section = document.getElementById('leaderboard-section');
    if (!section) return;
    section.innerHTML = people.map((p, i) => {
      const rankClass = i === 0 ? 'r1' : i === 1 ? 'r2' : i === 2 ? 'r3' : 'rx';
      const retClass = p.ret > 0 ? 'pos' : p.ret < 0 ? 'neg' : 'flat';
      return `
        <div class="lb-row ${p.id === active ? 'active' : ''}" onclick="sel('${p.id}')">
          <div class="lb-rank ${rankClass}">${i + 1}</div>
          <div class="lb-name">${esc(p.name)}</div>
          <div class="lb-ret ${retClass}">${fmtPct(p.ret)}</div>
        </div>`;
    }).join('');
  }

  function renderTabs(people) {
    const section = document.getElementById('tabs-section');
    if (section) {
      section.innerHTML = people.map(p =>
        `<button class="tab ${p.id === active ? 'active' : ''}" onclick="sel('${p.id}')">${esc(p.name)}</button>`
      ).join('');
    }
  }

  function renderPortfolio(people) {
    const section = document.getElementById('portfolio-section');
    const p = people.find(x => x.id === active);
    if (!p || !section) return;

    const gainClass = p.gain > 0 ? 'pos' : p.gain < 0 ? 'neg' : 'flat';

    section.innerHTML = `
      <div class="port-card">
        <div class="port-name">${esc(p.name)}'s Portfolio</div>
        <div class="port-summary">
          <div class="sum-col"><div class="sum-label">Value</div><div class="sum-val">${fmtDollar(p.val)}</div></div>
          <div class="sum-col">
            <div class="sum-label">Gain</div>
            <div class="sum-val ${gainClass}">${p.gain >= 0 ? '+' : ''}${fmtDollar(p.gain)}</div>
            <div class="sum-sub">${fmtPct(p.ret)}</div>
          </div>
          <div class="sum-col"><div class="sum-label">Cost</div><div class="sum-val">${fmtDollar(p.cost)}</div></div>
        </div>
        <table class="stock-table">
          <thead><tr><th>Ticker</th><th class="num">Shares</th><th class="num">Current</th><th class="num">Return</th></tr></thead>
          <tbody>
            ${p.stocks.map(s => {
              const showLoading = s.cur === 0 && loading;
              const displayPrice = s.cur > 0 ? fmtDollar(s.cur) : (showLoading ? '<span class="spin"></span>' : fmtDollar(parseFloat(s.buyPrice)));
              return `
              <tr>
                <td><span class="stock-sym">${esc(s.symbol)}</span></td>
                <td class="num">${s.shares}</td>
                <td class="num">${displayPrice}</td>
                <td class="num ${s.ret > 0 ? 'pos' : 'neg'}">${fmtPct(s.ret)}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`;
  }

  function renderStatus() {
    const el = document.getElementById('status-section');
    if (!el) return;
    
    if (loading) {
      el.innerHTML = `Fetching live prices... <span class="spin"></span>`;
    } else {
      const ts = state.updated ? new Date(state.updated).toLocaleTimeString() : 'Not yet updated';
      el.innerHTML = `Prices last updated: ${ts} · <a href="#" onclick="event.preventDefault();refreshAll();">Refresh now</a>`;
    }
  }

  // ═══ News (Simplified for now) ═══════════════════════
  function refreshNews() {
    const section = document.getElementById('news-section');
    if (!section) return;
    
    section.innerHTML = `
      <div class="news-feed">
        <div class="news-header">
          <div class="section-label" style="margin: 0;">Market News</div>
        </div>
        <div class="news-empty">News feed coming soon</div>
      </div>`;
  }

  window.sel = id => { active = id; render(); };
  window.refreshAll = refreshAll;

  // Initialize
  loadPortfolioData();
  setInterval(refreshAll, 120000); // Auto-refresh every 2 minutes
})();
</script>
</body>
</html>

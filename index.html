<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investing Experiment — Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAFAF7;
    --white: #FFFFFF;
    --surface: #FFFFFF;
    --navy: #1B2A4A;
    --navy-light: #2C3E6B;
    --navy-faint: rgba(27, 42, 74, 0.04);
    --gold: #B8923E;
    --gold-light: #D4AD5C;
    --gold-faint: rgba(184, 146, 62, 0.08);
    --gold-border: rgba(184, 146, 62, 0.2);
    --green: #2D8F5E;
    --green-light: #E8F5EE;
    --green-faint: rgba(45, 143, 94, 0.08);
    --red: #C0392B;
    --red-light: #FCEAE8;
    --red-faint: rgba(192, 57, 43, 0.08);
    --text: #2D2D2D;
    --text-secondary: #5A5A5A;
    --text-light: #8A8A8A;
    --border: #E5E2DC;
    --border-light: #EDEBE6;
    --rule: #D4D0C8;
    --silver-medal: #6B7C93;
    --bronze-medal: #A67C52;
    --font-display: 'Libre Baskerville', Georgia, serif;
    --font-body: 'Source Sans 3', 'Segoe UI', sans-serif;
    --max-w: 780px;
    --transition: 0.3s ease;
    --radius: 6px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    line-height: 1.7;
    font-size: 16px;
  }

  /* ── Top Bar ──────────────────────────────────────── */
  .topbar {
    background: var(--navy);
    padding: 14px 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .topbar-logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .topbar-logo svg { width: 28px; height: 28px; }
  .topbar-title {
    font-family: var(--font-display);
    color: var(--white);
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .topbar-nav {
    position: absolute;
    right: 32px;
  }
  .topbar-link {
    color: rgba(255,255,255,0.55);
    font-size: 13px;
    text-decoration: none;
    letter-spacing: 0.04em;
    transition: color var(--transition);
  }
  .topbar-link:hover { color: rgba(255,255,255,0.9); }

  /* ── Hero ─────────────────────────────────────────── */
  .hero {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 56px 32px 48px;
    text-align: center;
  }
  .hero-overline {
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 16px;
  }
  .hero h1 {
    font-family: var(--font-display);
    font-size: clamp(26px, 4.5vw, 38px);
    font-weight: 400;
    color: var(--navy);
    line-height: 1.3;
    margin-bottom: 12px;
    letter-spacing: -0.01em;
  }
  .hero-subtitle {
    font-size: 16px;
    color: var(--text-secondary);
    max-width: 480px;
    margin: 0 auto;
    line-height: 1.65;
    font-weight: 300;
  }

  /* ── Content ──────────────────────────────────────── */
  .content {
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 40px 28px 80px;
  }

  /* ── Section Label ────────────────────────────────── */
  .section-label {
    font-family: var(--font-display);
    font-size: 13px;
    color: var(--gold);
    letter-spacing: 0.06em;
    margin-bottom: 14px;
    font-weight: 400;
  }

  /* ── Leaderboard ──────────────────────────────────── */
  .leaderboard {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 32px;
    margin-bottom: 32px;
  }
  .lb-row {
    display: grid;
    grid-template-columns: 36px 1fr auto;
    align-items: center;
    gap: 14px;
    padding: 13px 16px;
    border-radius: 4px;
    margin-bottom: 2px;
    cursor: pointer;
    transition: background var(--transition);
  }
  .lb-row:hover { background: var(--navy-faint); }
  .lb-row.active { background: var(--gold-faint); outline: 1px solid var(--gold-border); }
  .lb-rank {
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 700;
    text-align: center;
    width: 28px;
  }
  .lb-rank.r1 { color: var(--gold); }
  .lb-rank.r2 { color: var(--silver-medal); }
  .lb-rank.r3 { color: var(--bronze-medal); }
  .lb-rank.rx { color: var(--text-light); }
  .lb-name {
    font-weight: 500;
    font-size: 15px;
    color: var(--navy);
  }
  .lb-name .leader-badge {
    display: inline-block;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--gold);
    background: var(--gold-faint);
    border: 1px solid var(--gold-border);
    padding: 2px 7px;
    border-radius: 3px;
    margin-left: 8px;
    vertical-align: middle;
  }
  .lb-ret {
    font-weight: 600;
    font-size: 15px;
    font-family: var(--font-display);
    letter-spacing: -0.01em;
  }
  .lb-ret.pos { color: var(--green); }
  .lb-ret.neg { color: var(--red); }
  .lb-ret.flat { color: var(--text-light); }

  /* ── Tabs ─────────────────────────────────────────── */
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .tab {
    padding: 9px 20px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-secondary);
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--transition);
    white-space: nowrap;
  }
  .tab:hover { border-color: var(--rule); color: var(--navy); }
  .tab.active {
    background: var(--navy);
    border-color: var(--navy);
    color: var(--white);
  }
  .tab.add-tab {
    border-style: dashed;
    color: var(--text-light);
  }
  .tab.add-tab:hover {
    border-color: var(--gold);
    color: var(--gold);
  }

  /* ── Portfolio Card ───────────────────────────────── */
  .card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 32px;
    margin-bottom: 16px;
    animation: slideUp 0.35s ease;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 14px;
  }
  .card-name {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 400;
    color: var(--navy);
  }
  .metrics { display: flex; gap: 32px; flex-wrap: wrap; }
  .metric { text-align: right; }
  .metric-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-light);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 3px;
  }
  .metric-val {
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 700;
    color: var(--navy);
  }
  .metric-val.pos { color: var(--green); }
  .metric-val.neg { color: var(--red); }

  /* ── Table ────────────────────────────────────────── */
  .tbl {
    width: 100%;
    border-collapse: collapse;
    margin-top: 4px;
  }
  .tbl th {
    text-align: left;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-light);
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--navy-faint);
  }
  .tbl th.r, .tbl td.r { text-align: right; }
  .tbl td {
    padding: 12px 12px;
    border-bottom: 1px solid var(--border-light);
    font-size: 14px;
    color: var(--text);
  }
  .tbl tbody tr:last-child td { border-bottom: none; }
  .tbl tbody tr { transition: background var(--transition); }
  .tbl tbody tr:hover { background: var(--navy-faint); }

  .sym {
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.03em;
    color: var(--navy);
  }
  .sym-name {
    color: var(--text-light);
    font-size: 12px;
    margin-top: 2px;
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pill {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 4px;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.01em;
  }
  .pill.pos { color: var(--green); background: var(--green-faint); }
  .pill.neg { color: var(--red); background: var(--red-faint); }

  .row-actions { display: flex; gap: 4px; justify-content: flex-end; }
  .row-btn {
    background: none;
    border: none;
    color: var(--text-light);
    cursor: pointer;
    font-size: 13px;
    padding: 4px 6px;
    border-radius: 4px;
    opacity: 0;
    transition: all var(--transition);
  }
  .tbl tbody tr:hover .row-btn { opacity: 1; }
  .row-btn:hover { color: var(--navy); background: var(--navy-faint); }
  .row-btn.del:hover { color: var(--red); background: var(--red-faint); }

  /* ── Add Form ─────────────────────────────────────── */
  .add-form {
    display: flex;
    gap: 8px;
    margin-top: 20px;
    flex-wrap: wrap;
    align-items: center;
  }
  .add-form input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 9px 12px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    transition: border-color var(--transition);
    outline: none;
  }
  .add-form input:focus { border-color: var(--gold); }
  .add-form input::placeholder { color: var(--text-light); }
  .in-sym { width: 100px; text-transform: uppercase; }
  .in-shares { width: 90px; }
  .in-price { width: 120px; }
  .in-date { width: 148px; }

  /* ── Buttons ──────────────────────────────────────── */
  .btn {
    padding: 9px 20px;
    border-radius: 4px;
    border: none;
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition);
    letter-spacing: 0.02em;
  }
  .btn-primary {
    background: var(--gold);
    color: var(--white);
  }
  .btn-primary:hover {
    background: var(--gold-light);
    transform: translateY(-1px);
    box-shadow: 0 3px 12px rgba(184, 146, 62, 0.25);
  }
  .btn-outline {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 13px;
    padding: 7px 14px;
    font-weight: 500;
  }
  .btn-outline:hover { border-color: var(--rule); color: var(--navy); }
  .btn-outline.danger:hover { border-color: rgba(192, 57, 43, 0.3); color: var(--red); }
  .card-footer { display: flex; justify-content: flex-end; margin-top: 16px; gap: 8px; }

  /* ── Modal ────────────────────────────────────────── */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(27, 42, 74, 0.35);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 36px;
    width: 92%;
    max-width: 420px;
    animation: slideUp 0.25s ease;
    box-shadow: 0 20px 60px rgba(27, 42, 74, 0.15);
  }
  .modal h3 {
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 400;
    color: var(--navy);
    margin-bottom: 6px;
  }
  .modal .modal-desc {
    font-size: 14px;
    color: var(--text-secondary);
    margin-bottom: 20px;
  }
  .modal-field { margin-bottom: 16px; }
  .modal-field label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-light);
    margin-bottom: 5px;
  }
  .modal-field input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 14px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    outline: none;
    transition: border-color var(--transition);
  }
  .modal-field input:focus { border-color: var(--gold); }
  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 22px; }
  .btn-ghost {
    background: transparent; border: none; color: var(--text-secondary);
    font-family: var(--font-body); font-size: 13px; cursor: pointer;
    padding: 9px 14px; font-weight: 500;
  }
  .btn-ghost:hover { color: var(--navy); }

  /* ── Status ───────────────────────────────────────── */
  .status {
    text-align: center;
    padding: 16px;
    color: var(--text-light);
    font-size: 12px;
    letter-spacing: 0.03em;
  }
  .status a {
    color: var(--text-secondary);
    text-decoration: none;
    transition: color var(--transition);
  }
  .status a:hover { color: var(--gold); }

  /* ── Empty state ──────────────────────────────────── */
  .empty {
    text-align: center;
    padding: 44px 20px;
    color: var(--text-light);
  }
  .empty p { margin-bottom: 6px; font-size: 15px; }
  .empty .hint { font-size: 13px; color: var(--text-light); }

  /* ── Spinner ──────────────────────────────────────── */
  .spin {
    display: inline-block; width: 12px; height: 12px;
    border: 1.5px solid var(--border); border-top-color: var(--gold);
    border-radius: 50%; animation: sp 0.7s linear infinite;
    margin-left: 6px; vertical-align: middle;
  }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* ── Toast ────────────────────────────────────────── */
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--navy);
    border: 1px solid var(--navy-light);
    border-radius: 4px;
    padding: 10px 20px;
    font-size: 13px;
    color: rgba(255,255,255,0.9);
    z-index: 200;
    transition: transform 0.25s ease;
    white-space: nowrap;
    font-weight: 500;
    box-shadow: 0 6px 20px rgba(27, 42, 74, 0.2);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.err { background: var(--red); border-color: var(--red); }

  /* ── News Feed ────────────────────────────────────── */
  .news-feed {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 32px;
    margin-top: 32px;
  }
  .news-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .news-header .section-label { margin-bottom: 0; }
  .news-refresh {
    background: none; border: none; color: var(--text-light);
    font-family: var(--font-body); font-size: 12px; cursor: pointer;
    padding: 4px 10px; border-radius: 4px; transition: all var(--transition);
    letter-spacing: 0.03em;
  }
  .news-refresh:hover { color: var(--gold); background: var(--gold-faint); }
  .news-list { list-style: none; }
  .news-item {
    display: flex;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border-light);
    transition: opacity var(--transition);
  }
  .news-item:last-child { border-bottom: none; }
  .news-item:hover { opacity: 0.8; }
  .news-ticker {
    flex-shrink: 0;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--navy);
    background: var(--navy-faint);
    border: 1px solid var(--border-light);
    padding: 3px 8px;
    border-radius: 3px;
    height: fit-content;
    margin-top: 2px;
  }
  .news-body { flex: 1; min-width: 0; }
  .news-title {
    font-size: 14px;
    font-weight: 500;
    line-height: 1.5;
    margin-bottom: 4px;
  }
  .news-title a {
    color: var(--text);
    text-decoration: none;
    transition: color var(--transition);
  }
  .news-title a:hover { color: var(--gold); }
  .news-meta {
    font-size: 12px;
    color: var(--text-light);
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .news-source { color: var(--text-secondary); }
  .news-empty, .news-loading {
    text-align: center;
    padding: 24px;
    color: var(--text-light);
    font-size: 13px;
  }

  /* ── Footer ───────────────────────────────────────── */
  .footer {
    text-align: center;
    padding: 32px 24px;
    font-size: 12px;
    color: var(--text-light);
    border-top: 1px solid var(--border-light);
    max-width: var(--max-w);
    margin: 0 auto;
  }

  /* ── Responsive ───────────────────────────────────── */
  @media (max-width: 680px) {
    .topbar { padding: 12px 20px; position: relative; }
    .topbar-title { font-size: 12px; letter-spacing: 0.06em; }
    .topbar-nav { position: static; margin-left: auto; }
    .hero { padding: 40px 20px 36px; }
    .content { padding: 32px 18px 60px; }
    .leaderboard, .card { padding: 22px 20px; }
    .metrics { gap: 18px; }
    .tbl th:nth-child(4), .tbl td:nth-child(4) { display: none; }
    .add-form { flex-direction: column; }
    .add-form input { width: 100%; }
    .tab { padding: 7px 14px; font-size: 12px; }
    .card-header { flex-direction: column; }
    .metrics { justify-content: flex-start; }
    .metric { text-align: left; }
    .news-feed { padding: 22px 20px; }
    .news-item { flex-direction: column; gap: 6px; }
    .news-ticker { width: fit-content; }
  }

  /* ── Print ────────────────────────────────────────── */
  @media print {
    .topbar, .add-form, .card-footer, .row-actions { display: none; }
    body { background: white; }
    .hero { border: none; padding: 24px 0; }
    .content { padding: 16px 0; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">
    <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="1" y="1" width="26" height="26" rx="4" stroke="rgba(184,146,62,0.5)" stroke-width="1.2"/>
      <path d="M7 20 L11 13 L15.5 16 L21 8" stroke="#B8923E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="21" cy="8" r="1.8" fill="#B8923E"/>
    </svg>
    <span class="topbar-title">Investing Experiment</span>
  </div>
  <div class="topbar-nav">
    <a class="topbar-link" href="https://aterstallaco.github.io/investingexperiment/Outline.html">Guidelines</a>
  </div>
</div>

<div class="hero">
  <div class="hero-overline">Portfolio Tracker</div>
  <h1>Investing Experiment</h1>
  <p class="hero-subtitle">Track everyone's picks, follow the performance, and see who's leading the pack.</p>
</div>

<div class="content">
  <div id="leaderboard-section"></div>
  <div id="tabs-section"></div>
  <div id="portfolio-section"></div>
  <div id="news-section"></div>
  <div id="status-section" class="status"></div>
</div>

<div class="footer">
  Investing Experiment &middot; For entertainment and educational purposes &middot; Not financial advice
</div>

<div id="modal-root"></div>
<div id="toast" class="toast"></div>

<script>
(function() {
  const KEY = 'fic-v2';
  let state = load();
  let active = state.people.length > 0 ? state.people[0].id : null;
  let loading = false;
  let cache = {};
  const CACHE_TTL = 5 * 60 * 1000;

  function load() {
    try { const r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch(e) {}
    return { people: [], updated: null };
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

  async function fetchQuote(sym) {
    const now = Date.now();
    if (cache[sym] && (now - cache[sym].ts) < CACHE_TTL) return cache[sym];
    const endpoints = [
      `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=1d&range=5d`)}`,
      `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://query2.finance.yahoo.com/v8/finance/chart/${sym}?interval=1d&range=5d`)}`
    ];
    for (const url of endpoints) {
      try {
        const resp = await fetch(url);
        if (!resp.ok) continue;
        const data = await resp.json();
        const meta = data.chart.result[0].meta;
        const price = meta.regularMarketPrice;
        const prev = meta.chartPreviousClose || meta.previousClose;
        const dayChg = prev ? ((price - prev) / prev * 100) : 0;
        cache[sym] = { price, name: meta.shortName || meta.longName || sym, dayChg, ts: now };
        return cache[sym];
      } catch(e) { continue; }
    }
    if (cache[sym]) return cache[sym];
    return null;
  }

  async function refreshAll() {
    const syms = new Set();
    state.people.forEach(p => p.stocks.forEach(s => syms.add(s.symbol)));
    if (syms.size === 0) return;
    loading = true; render();
    await Promise.allSettled([...syms].map(s => fetchQuote(s)));
    state.updated = new Date().toISOString();
    loading = false; save(); render();
  }

  function stockCalc(s) {
    const q = cache[s.symbol];
    if (!q) return { cur: 0, gain: 0, pct: 0, price: null, name: s.symbol };
    const cur = q.price * s.shares;
    const cost = s.buyPrice * s.shares;
    const gain = cur - cost;
    const pct = cost > 0 ? (gain / cost * 100) : 0;
    return { cur, gain, pct, price: q.price, name: q.name, dayChg: q.dayChg };
  }

  function portCalc(p) {
    let cost = 0, cur = 0;
    p.stocks.forEach(s => { const c = stockCalc(s); cost += s.buyPrice * s.shares; cur += c.cur; });
    const gain = cur - cost;
    const pct = cost > 0 ? (gain / cost * 100) : 0;
    return { cost, cur, gain, pct };
  }

  const fmt = (n) => '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const vc = (n) => n > 0 ? 'pos' : n < 0 ? 'neg' : 'flat';
  const sgn = (n) => n >= 0 ? '+' : '';
  const uid = (pre) => pre + Date.now() + Math.random().toString(36).slice(2,6);
  function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function render() { renderLB(); renderTabs(); renderPort(); renderNews(); renderStatus(); }

  function renderLB() {
    const el = document.getElementById('leaderboard-section');
    if (state.people.length === 0) { el.innerHTML = ''; return; }
    const ranked = state.people.map(p => ({ ...p, ...portCalc(p) })).sort((a, b) => b.pct - a.pct);
    el.innerHTML = `
      <div class="leaderboard">
        <div class="section-label">Leaderboard</div>
        ${ranked.map((p, i) => {
          const rc = i < 3 ? `r${i+1}` : 'rx';
          const badge = i === 0 && p.stocks.length > 0 ? '<span class="leader-badge">Leader</span>' : '';
          const ret = p.stocks.length > 0 ? `${sgn(p.pct)}${p.pct.toFixed(1)}%` : '\u2014';
          return `<div class="lb-row ${p.id === active ? 'active' : ''}" onclick="sel('${p.id}')">
            <div class="lb-rank ${rc}">${i + 1}</div>
            <div class="lb-name">${esc(p.name)}${badge}</div>
            <div class="lb-ret ${p.stocks.length > 0 ? vc(p.pct) : 'flat'}">${ret}</div>
          </div>`;
        }).join('')}
      </div>`;
  }

  function renderTabs() {
    document.getElementById('tabs-section').innerHTML = `
      <div class="tabs">
        ${state.people.map(p => `<button class="tab ${p.id === active ? 'active' : ''}" onclick="sel('${p.id}')">${esc(p.name)}</button>`).join('')}
        <button class="tab add-tab" onclick="modalAddPerson()">+ Add Person</button>
      </div>`;
  }

  function renderPort() {
    const el = document.getElementById('portfolio-section');
    const p = state.people.find(x => x.id === active);
    if (!p) { el.innerHTML = '<div class="empty"><p>Add family members to get started</p><p class="hint">Click "+ Add Person" above</p></div>'; return; }
    const { cost, cur, gain, pct } = portCalc(p);
    el.innerHTML = `
      <div class="card">
        <div class="card-header">
          <div class="card-name">${esc(p.name)}</div>
          <div class="metrics">
            <div class="metric"><div class="metric-label">Invested</div><div class="metric-val">${fmt(cost)}</div></div>
            <div class="metric"><div class="metric-label">Current Value</div><div class="metric-val">${fmt(cur)}</div></div>
            <div class="metric"><div class="metric-label">Total Return</div><div class="metric-val ${vc(gain)}">${p.stocks.length > 0 ? sgn(pct) + pct.toFixed(1) + '%' : '\u2014'}</div></div>
          </div>
        </div>
        ${p.stocks.length > 0 ? `
        <table class="tbl"><thead><tr>
          <th>Holding</th><th class="r">Shares</th><th class="r">Avg Cost</th><th class="r">Current</th><th class="r">Return</th><th></th>
        </tr></thead><tbody>
          ${p.stocks.map(s => {
            const c = stockCalc(s);
            return `<tr>
              <td><div class="sym">${esc(s.symbol)}</div><div class="sym-name">${esc(c.name)}</div></td>
              <td class="r">${s.shares}</td>
              <td class="r">${fmt(s.buyPrice)}</td>
              <td class="r">${c.price != null ? fmt(c.price) : '\u2014'}</td>
              <td class="r">${c.price != null ? `<span class="pill ${vc(c.gain)}">${sgn(c.pct)}${c.pct.toFixed(1)}%</span>` : '\u2014'}</td>
              <td class="r"><div class="row-actions">
                <button class="row-btn" onclick="modalEditStock('${p.id}','${s.id}')" title="Edit">\u270E</button>
                <button class="row-btn del" onclick="delStock('${p.id}','${s.id}')" title="Remove">\u2715</button>
              </div></td>
            </tr>`;
          }).join('')}
        </tbody></table>` : '<div class="empty"><p>No holdings yet</p><p class="hint">Add stocks, ETFs, or crypto below</p></div>'}
        <form class="add-form" onsubmit="addStock(event,'${p.id}')">
          <input type="text" class="in-sym" name="symbol" placeholder="Ticker" required maxlength="12" autocomplete="off">
          <input type="number" class="in-shares" name="shares" placeholder="Shares" required min="0.001" step="any">
          <input type="number" class="in-price" name="buyPrice" placeholder="Buy price $" required min="0.01" step="any">
          <input type="date" class="in-date" name="buyDate">
          <button type="submit" class="btn btn-primary">Add</button>
        </form>
        <div class="card-footer">
          <button class="btn-outline danger" onclick="delPerson('${p.id}')">Remove ${esc(p.name)}</button>
        </div>
      </div>`;
  }

  function renderStatus() {
    const sp = loading ? '<span class="spin"></span>' : '';
    const ts = state.updated ? new Date(state.updated).toLocaleString() : '\u2014';
    document.getElementById('status-section').innerHTML = `
      Last updated: ${ts} ${sp}
      &nbsp;\u00B7&nbsp; <a href="#" onclick="event.preventDefault();refreshAll();">Refresh</a>
      &nbsp;\u00B7&nbsp; <a href="#" onclick="event.preventDefault();exportJSON();">Export</a>
      &nbsp;\u00B7&nbsp; <a href="#" onclick="event.preventDefault();importJSON();">Import</a>`;
  }

  // ═══ News Feed ═══════════════════════════════════════
  let newsCache = {};
  let newsLoading = false;
  const NEWS_TTL = 15 * 60 * 1000;

  async function fetchNews(sym) {
    const now = Date.now();
    if (newsCache[sym] && (now - newsCache[sym].ts) < NEWS_TTL) return newsCache[sym].items;
    try {
      const rssUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(sym + ' stock')}&hl=en-US&gl=US&ceid=US:en`;
      const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(rssUrl)}`;
      const resp = await fetch(proxyUrl);
      if (!resp.ok) return [];
      const text = await resp.text();
      const parser = new DOMParser();
      const xml = parser.parseFromString(text, 'text/xml');
      const items = [...xml.querySelectorAll('item')].slice(0, 3).map(item => {
        const title = item.querySelector('title')?.textContent || '';
        const link = item.querySelector('link')?.textContent || '';
        const pubDate = item.querySelector('pubDate')?.textContent || '';
        const source = item.querySelector('source')?.textContent || '';
        return { title, link, pubDate, source, symbol: sym };
      });
      newsCache[sym] = { items, ts: now };
      return items;
    } catch(e) { return newsCache[sym]?.items || []; }
  }

  async function refreshNews() {
    const p = state.people.find(x => x.id === active);
    if (!p || p.stocks.length === 0) { renderNews(); return; }
    newsLoading = true; renderNews();
    const syms = [...new Set(p.stocks.map(s => s.symbol))];
    await Promise.allSettled(syms.map(s => fetchNews(s)));
    newsLoading = false; renderNews();
  }

  function renderNews() {
    const el = document.getElementById('news-section');
    const p = state.people.find(x => x.id === active);
    if (!p || p.stocks.length === 0) { el.innerHTML = ''; return; }

    const syms = [...new Set(p.stocks.map(s => s.symbol))];
    let allNews = [];
    syms.forEach(sym => {
      if (newsCache[sym]) allNews.push(...newsCache[sym].items);
    });

    allNews.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
    allNews = allNews.slice(0, 10);

    const formatTime = (dateStr) => {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      const now = new Date();
      const diffMs = now - d;
      const diffMins = Math.floor(diffMs / 60000);
      if (diffMins < 60) return `${diffMins}m ago`;
      const diffHrs = Math.floor(diffMins / 60);
      if (diffHrs < 24) return `${diffHrs}h ago`;
      const diffDays = Math.floor(diffHrs / 24);
      return `${diffDays}d ago`;
    };

    el.innerHTML = `
      <div class="news-feed">
        <div class="news-header">
          <div class="section-label">Market News</div>
          <button class="news-refresh" onclick="event.preventDefault();refreshNews();">
            ${newsLoading ? '<span class="spin"></span> Loading' : 'Refresh'}
          </button>
        </div>
        ${newsLoading && allNews.length === 0 ? '<div class="news-loading">Fetching headlines\u2026</div>' :
          allNews.length > 0 ? `
          <ul class="news-list">
            ${allNews.map(n => `
              <li class="news-item">
                <span class="news-ticker">${esc(n.symbol)}</span>
                <div class="news-body">
                  <div class="news-title"><a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a></div>
                  <div class="news-meta">
                    ${n.source ? `<span class="news-source">${esc(n.source)}</span>` : ''}
                    ${n.pubDate ? `<span>${formatTime(n.pubDate)}</span>` : ''}
                  </div>
                </div>
              </li>
            `).join('')}
          </ul>` : '<div class="news-empty">No headlines yet \u2014 click Refresh to load news</div>'}
      </div>`;
  }

  window.refreshNews = refreshNews;

  window.sel = id => { active = id; render(); refreshNews(); };

  window.modalAddPerson = () => {
    openModal(`<h3>Add Family Member</h3><p class="modal-desc">Enter their name to create a portfolio</p>
      <form onsubmit="doAddPerson(event)">
        <div class="modal-field"><label>Name</label><input type="text" name="nm" required maxlength="30" autofocus></div>
        <div class="modal-btns"><button type="button" class="btn-ghost" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary">Add</button></div>
      </form>`);
  };

  window.doAddPerson = e => {
    e.preventDefault();
    const nm = e.target.nm.value.trim();
    if (!nm) return;
    const id = uid('p');
    state.people.push({ id, name: nm, stocks: [] });
    active = id; save(); closeModal(); render(); toast(`${nm} added`);
  };

  window.delPerson = id => {
    const p = state.people.find(x => x.id === id);
    if (!p || !confirm(`Remove ${p.name} and all their holdings?`)) return;
    state.people = state.people.filter(x => x.id !== id);
    if (active === id) active = state.people.length > 0 ? state.people[0].id : null;
    save(); render(); toast(`${p.name} removed`);
  };

  window.addStock = async (e, pid) => {
    e.preventDefault();
    const f = e.target;
    const sym = f.symbol.value.trim().toUpperCase();
    const shares = parseFloat(f.shares.value);
    const bp = parseFloat(f.buyPrice.value);
    const bd = f.buyDate.value || null;
    if (!sym || !shares || !bp) return;
    const p = state.people.find(x => x.id === pid);
    if (!p) return;
    p.stocks.push({ id: uid('s'), symbol: sym, shares, buyPrice: bp, buyDate: bd });
    save(); f.reset(); render(); toast(`${sym} added`);
    await fetchQuote(sym); render();
    fetchNews(sym).then(() => renderNews());
  };

  window.modalEditStock = (pid, sid) => {
    const p = state.people.find(x => x.id === pid);
    const s = p?.stocks.find(x => x.id === sid);
    if (!s) return;
    openModal(`<h3>Edit Holding</h3><p class="modal-desc">Update ${esc(s.symbol)} in ${esc(p.name)}\u2019s portfolio</p>
      <form onsubmit="doEditStock(event,'${pid}','${sid}')">
        <div class="modal-field"><label>Ticker</label><input type="text" name="symbol" value="${esc(s.symbol)}" required maxlength="12" style="text-transform:uppercase"></div>
        <div class="modal-field"><label>Shares</label><input type="number" name="shares" value="${s.shares}" required min="0.001" step="any"></div>
        <div class="modal-field"><label>Buy Price ($)</label><input type="number" name="buyPrice" value="${s.buyPrice}" required min="0.01" step="any"></div>
        <div class="modal-field"><label>Buy Date</label><input type="date" name="buyDate" value="${s.buyDate || ''}"></div>
        <div class="modal-btns"><button type="button" class="btn-ghost" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary">Save Changes</button></div>
      </form>`);
  };

  window.doEditStock = async (e, pid, sid) => {
    e.preventDefault();
    const p = state.people.find(x => x.id === pid);
    const s = p?.stocks.find(x => x.id === sid);
    if (!s) return;
    const oldSym = s.symbol;
    s.symbol = e.target.symbol.value.trim().toUpperCase();
    s.shares = parseFloat(e.target.shares.value);
    s.buyPrice = parseFloat(e.target.buyPrice.value);
    s.buyDate = e.target.buyDate.value || null;
    save(); closeModal(); render(); toast(`${s.symbol} updated`);
    if (s.symbol !== oldSym) { await fetchQuote(s.symbol); render(); }
  };

  window.delStock = (pid, sid) => {
    const p = state.people.find(x => x.id === pid);
    const s = p?.stocks.find(x => x.id === sid);
    if (!s) return;
    p.stocks = p.stocks.filter(x => x.id !== sid);
    save(); render(); toast(`${s.symbol} removed`);
  };

  window.exportJSON = () => {
    const b = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(b);
    a.download = 'family-investing-data.json'; a.click(); URL.revokeObjectURL(a.href);
  };

  window.importJSON = () => {
    const input = document.createElement('input'); input.type = 'file'; input.accept = '.json';
    input.onchange = async (e) => {
      try {
        const text = await e.target.files[0].text();
        const data = JSON.parse(text);
        if (data.people && Array.isArray(data.people)) {
          state = data; active = state.people.length > 0 ? state.people[0].id : null;
          save(); render(); refreshAll(); toast('Data imported');
        } else { toast('Invalid file format', true); }
      } catch(err) { toast('Import failed', true); }
    };
    input.click();
  };

  function openModal(html) {
    const el = document.getElementById('modal-root');
    el.innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
    setTimeout(() => el.querySelector('input')?.focus(), 80);
  }
  window.closeModal = () => { document.getElementById('modal-root').innerHTML = ''; };

  function toast(msg, err = false) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = `toast show ${err ? 'err' : ''}`;
    setTimeout(() => t.className = 'toast', 2200);
  }

  render();
  if (state.people.length > 0) { refreshAll(); refreshNews(); }
  setInterval(refreshAll, 5 * 60 * 1000);
  setInterval(refreshNews, 15 * 60 * 1000);
})();
</script>
</body>
</html>
